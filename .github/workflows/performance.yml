
name: PulseCheck CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run API Smoke Test
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://dummyjson.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare Reports Directory
        run: mkdir -p reports

      - name: Run Smoke Test
        run: k6 run tests/smoke-test.js

      - name: Verify Generated Reports
        if: always()
        run: |
          echo "Checking reports directory..."
          ls -la reports/

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsecheck-smoke-test-reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn
